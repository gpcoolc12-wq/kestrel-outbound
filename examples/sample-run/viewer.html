09:09 UTC", "body": "Created this issue from the Kestrel brief (label Source: Brief) and filled the issue template.\n\nSegment **Mixed**, chosen from the firm's own website: \"His vision incorporated our own with a keen attention to detail and we couldn’t be happier with the outcome of our project.” LA, Charlotte, VT CONTACT @ STADECKER.COM 802.777.4224 commercial fabrication landscape residential uncategorized commercial fabrication landscape residential uncategorized © \" — [https://www.stadecker.com/](https://www.stadecker.com/)"}, {"at": "2026-10-05 09:09 UTC", "body": "Do-not-contact check: **Clear**. firm and named affiliates checked: Gabriel Stadecker Architect.\n\nSite checked: https://www.stadecker.com"}, {"at": "2026-10-05 09:09 UTC", "body": "Moved to In Progress to start research."}, {"at": "2026-10-05 09:09 UTC", "body": "Research: sourced fact — Gabriel Stadecker Architect's portfolio includes the 1812 Tavern House project.\n\nQuote: \"1812 TAVERN CHARLOTTE, VT Interior renovation of two story historic Tavern\"\n\nSource: [https://www.stadecker.com/work/architecture/1812-tavern-house/](https://www.stadecker.com/work/architecture/1812-tavern-house/)\n\nPages read: https://www.stadecker.com/, https://www.stadecker.com/work/, https://www.stadecker.com/work/architecture/1812-tavern-house/, https://www.stadecker.com/work/architecture/colchester-lake-house-1-2/, https://www.stadecker.com/info/, https://www.stadecker.com/category/landscape/, https://www.stadecker.com/category/commercial/, https://www.stadecker.com/category/fabrication/"}, {"at": "2026-10-05 09:09 UTC", "body": "Draft: wrote email (73 words), opening with the sourced fact ([source](https://www.stadecker.com/work/architecture/1812-tavern-house/)). Approved claims only, standard sign-off."}, {"at": "2026-10-05 09:09 UTC", "body": "Sent for approval: moved to In Review and added Ready for Approval. Could not assign to Nirbhay yet: nbakshi@invictus.ai has been invited but has not joined the workspace."}, {"at": "2026-10-05 09:09 UTC", "body": "Assigned to Nirbhay for approval now that they have joined the workspace."}]}], "mails": [{"subject": "Kestrel Outbound Submission Gaurav Pawar", "to": "nbakshi@invictus.ai", "from": "\"Gaurav Pawar\"", "date": "Mon, 05 Oct 2026 14:39:33 +0530", "body": "Hi Nirbhay,\n\nHere is my submission for the Kestrel Outbound take-home.\n\n1. Linear workspace and the 10 issues: local_linear/BOARD.md\n2. Agent (repo + run instructions): https://github.com/gpcoolc12-wq/kestrel-outbound\n3. Guardrail note: local_linear/docs/Guardrail_note.md\n4. Part B: local_linear/docs/Part_B_What_I_would_change_about_this_SOP.md\n5. Loom: <Loom link>\n\nProject update: local_linear/BOARD.md#project-updates\n\nThanks,\nGaurav Pawar\n", "file": "2026-10-05_1439_Kestrel_Outbound_Submission_Gaurav_Pawar.eml"}, {"subject": "Kestrel Outbound Update 5 October 2026", "to": "nbakshi@invictus.ai", "from": "\"Gaurav Pawar\"", "date": "Mon, 05 Oct 2026 14:39:33 +0530", "body": "Done: Set up the Kestrel Outbound project in Linear; created all 10 issues; 8 researched and drafted, now In Review; 2 dropped (Casco Bay Design Workshop: website does not load; Providence Architecture & Building Co.: do-not-contact, affiliate of The Providence Group).\nBlocked: Nothing\nNeeds your call: What is Kestrel's standard sign-off? Drafts use \"Best, The Kestrel Rooms team\" until you confirm; For firms whose website does not load, which segment label should the issue carry?\n", "file": "2026-10-05_1439_Kestrel_Outbound_Update_5_October_2026.eml"}, {"subject": "Kestrel Outbound: clarifying questions", "to": "nbakshi@invictus.ai", "from": "\"Gaurav Pawar\"", "date": "Mon, 05 Oct 2026 14:39:32 +0530", "body": "Hi Nirbhay,\n\nI'm starting the Kestrel Outbound take-home. A few questions before I draft anything. Until you reply, I'll follow the SOP as written and use the defaults below.\n\n1. Sign-off: Step 5 says to sign every email with \"Kestrel's standard sign-off\", but the brief doesn't include one. What is it? Default until you reply: \"Best, The Kestrel Rooms team\", and I'll mark it as unconfirmed on every draft.\n\n2. Dead websites at Step 2: Step 2 says to choose each issue's segment from the firm's own website, and every issue must carry a segment label. The domain for Casco Bay Design Workshop (cascobaydesignworkshop.com) is not registered, so its site can't load. Default: I won't guess a segment. That issue gets only Source: Brief, and Step 4 then drops it.\n\n3. Do-not-contact matching: Providence Architecture & Building Co. shares the word \"Providence\" with The Providence Group. Default: I treat it as a match only if the names are the same, or if the firm's website names The Providence Group as a parent or affiliate. Sharing a city name doesn't count.\n\n4. \"No numbers\": the approved claims and call to action include \"30-day\", \"15-minute\" and \"less than a day\". Default: those are allowed, and no other numbers about Kestrel are.\n\n5. Assignment: I'll invite nbakshi@invictus.ai to the Linear workspace. Issues can only be assigned to you once you've accepted, so until then they'll sit in In Review with Ready for Approval, unassigned.\n\nThanks,\nGaurav\n", "file": "2026-10-05_1439_Kestrel_Outbound_clarifying_questions.eml"}], "docs": {"Guardrail note": "**Scope:** what the Kestrel outbound agent must never say, and how each rule is enforced while the email is being generated, before any human reviews it. The code is in `kestrel/guardrails.py`, and `tests/test_guardrails.py` proves each rule blocks its violation.\n\n**How every email is built.** This applies to both engines: the default offline rules and the optional LLM. The agent never writes about Kestrel. It writes two things only: a subject line, and an opener of one or two sentences about the prospect. Code then appends the approved product sentence, the approved call to action and the sign-off, copied verbatim from `config/kestrel.json`. Every draft goes through `validate_email()`. If any check fails, the draft is rejected and the exact violations go back to the model to regenerate. After 3 failed attempts the agent returns **no email** and the issue is marked Blocked. A bad draft never reaches review.\n\n## 1. Never say anything about Kestrel beyond the four approved claims\n\nThat means no extra features, numbers, customer names, comparisons, pricing or promises.\n\n* **Structural:** product copy is a fixed block inserted by code, and the model has no field in which to write a claim. A check confirms the fixed blocks are present and unaltered.\n* **Scan:** the model-written subject and opener are rejected if they contain product vocabulary (\"Kestrel\", software, booking, calendar, setup, trial, save, hours…), comparison or superlative words (better, faster, best, than, unlike, leading…), or `$ % € £`. A word is allowed only when it appears in the prospect's own source quote. For example, a firm that \"designs a calendar\" isn't penalised.\n* The only numbers about Kestrel that can appear are \"15-minute\", \"30-day\" and \"less than a day\", all inside the fixed blocks.\n\n## 2. Never say anything about the prospect that isn't backed by a verbatim quote from its own website\n\n* **Research:** each candidate fact must come with a quote and the URL it came from. Code checks that the quote appears word for word (after whitespace and punctuation are normalised) in the text actually fetched from that URL. If it doesn't, the fact is discarded and the next candidate is tried. A fact without a verified source is never used.\n* **Drafting:** every number in the opener and subject must appear in the source quote. Every capitalised name (a project, a place, a person, an award) must appear on the source page. That blocks invented details such as a wrong year, a made-up award or a misattributed project.\n* The first sentence must share key words with the quote, so the email opens with the sourced fact, as Step 5 requires.\n\n## 3. Never name another company\n\nThat covers Kestrel's customers (such as The Providence Group), do-not-contact firms, other prospects on the list, and competitors.\n\n* **Blocklist:** before any draft is accepted, the whole email (subject and body) is checked against a list built at run time from the do-not-contact list, the other nine prospects and known room-booking competitors. Matching uses word boundaries and normalises \"+\" and \"&\".\n* **Company-style names:** any name in the model's text ending in Construction, Builders, Inc, LLC, Group, Associates, Partners, Development, Bank… is rejected unless it is the prospect's own name. This catches companies the blocklist can't know about, like a builder credited on the prospect's own project page. I added this check after I had to override a draft that named the firm's builder.\n* **Same root as rule 2:** any capitalised name has to come from the prospect's own page, so the model can't add a company from its own memory either.\n* **Do-not-contact gate:** before any research, the firm and every parent or affiliate named on its site (each backed by a verified quote) are matched against the list. A mention anywhere on the site of a do-not-contact group whose affiliates are also excluded counts as a match. The issue is then dropped, and nothing about that firm is ever researched or drafted.\n\n**What review still does:** Nirbhay approves tone and whether the fact is a good hook. Review is not where these three rules are enforced.\n", "Part B — What I would change about this SOP": "I followed every step as written. Below are the changes I would make, starting with the ones that cost the most.\n\n## 1. Run the do-not-contact check before the segment is chosen (Steps 2 and 3)\n\nStep 2 has me read each firm's website to pick a segment label. Step 3 then says the do-not-contact check must happen \"before any research\". So a firm that should never be touched, such as a Providence Group affiliate, gets read, classified and written up before anyone checks the list. **Change:** at intake, create the issue with Source: Brief only, run the do-not-contact check, and add the segment label only if the firm is clear.\n\n## 2. Say what happens when a website doesn't load at intake\n\nStep 2 says every issue carries a segment label chosen from the firm's website. Step 4 says to drop a firm whose website doesn't load. Casco Bay Design Workshop's domain isn't registered, so I couldn't meet both rules. I left the segment blank rather than guess, and dropped the issue at Step 4. **Change:** add \"Segment: Unknown\", or let intake drop dead sites straight away.\n\n## 3. Put the missing inputs in the brief\n\n* **Kestrel's standard sign-off** isn't given anywhere, but Step 5 requires it. Every draft uses a placeholder that is flagged as unconfirmed.\n* **\"No numbers\"** clashes with the approved claims themselves (\"30-day\", \"15-minute\", \"less than a day\"). It should say \"no numbers beyond the approved claims\".\n* **Matching rule for the do-not-contact list.** \"Affiliate\" isn't defined, and fuzzy name matching would wrongly flag Providence Architecture & Building Co. against The Providence Group. **Change:** match exact names, plus any parent or affiliate the firm's own site names. Send near-misses to a human.\n\n## 4. Make \"invite accepted\" a precondition for Step 6\n\nYou can only assign an issue to someone who is a member of the workspace. Until Nirbhay accepts the invite, Step 6 can't be completed, so issues sit in In Review unassigned. **Change:** make \"approver has joined\" part of Step 1's definition of done, or assign approvals to a placeholder or triage queue.\n\n## 5. Lighten Step 7\n\nWriting both a comment and a description update for every action is the right audit trail, but it doubles the manual work and the chance of the two disagreeing. **Change:** the description holds the current state, and comments are the change log, written automatically by the agent (which is what my agent does). People only comment on judgement calls.\n\n## 6. Keep evidence of each fact, and capture it when the email is sent\n\nWebsites change. A fact that was true when researched can be gone by the time Nirbhay approves the draft. **Change:** store the verbatim quote and the date it was captured next to the URL (my agent stores the quote), and re-check the source just before sending.\n\n## 7. Approve in batches, and record rejections\n\nTen one-by-one approvals don't scale. **Change:** Nirbhay approves a batch, and every rejection is recorded with a reason code (\"weak hook\", \"tone\"…). Those codes feed back into the agent's prompts and guardrails.\n", "Clarifying questions (email to Nirbhay)": "Hi Nirbhay,\n\nI'm starting the Kestrel Outbound take-home. A few questions before I draft anything. Until you reply, I'll follow the SOP as written and use the defaults below.\n\n1. Sign-off: Step 5 says to sign every email with \"Kestrel's standard sign-off\", but the brief doesn't include one. What is it? Default until you reply: \"Best, The Kestrel Rooms team\", and I'll mark it as unconfirmed on every draft.\n\n2. Dead websites at Step 2: Step 2 says to choose each issue's segment from the firm's own website, and every issue must carry a segment label. The domain for Casco Bay Design Workshop (cascobaydesignworkshop.com) is not registered, so its site can't load. Default: I won't guess a segment. That issue gets only Source: Brief, and Step 4 then drops it.\n\n3. Do-not-contact matching: Providence Architecture & Building Co. shares the word \"Providence\" with The Providence Group. Default: I treat it as a match only if the names are the same, or if the firm's website names The Providence Group as a parent or affiliate. Sharing a city name doesn't count.\n\n4. \"No numbers\": the approved claims and call to action include \"30-day\", \"15-minute\" and \"less than a day\". Default: those are allowed, and no other numbers about Kestrel are.\n\n5. Assignment: I'll invite nbakshi@invictus.ai to the Linear workspace. Issues can only be assigned to you once you've accepted, so until then they'll sit in In Review with Ready for Approval, unassigned.\n\nThanks,\nGaurav\n"}, "tests": [["PASS", "test_clean_draft_passes"], ["PASS", "test_g1_product_claims_blocked"], ["PASS", "test_g1_comparison_blocked"], ["PASS", "test_g2_unsourced_number_blocked"], ["PASS", "test_g2_unsourced_name_blocked"], ["PASS", "test_g3_company_name_blocked"], ["PASS", "test_g3_third_party_company_on_page_blocked"], ["PASS", "test_must_open_with_fact"], ["PASS", "test_quote_must_be_verbatim"], ["PASS", "test_word_limit_and_signoff"], ["PASS", "test_dnc_exact_not_fuzzy"]], "claims": ["Book rooms, plotters and the model shop from one calendar.", "Works with Google Calendar and Microsoft Outlook.", "Setup takes less than a day.", "Free 30-day trial, no card needed."], "dnc_list": [{"company": "The Providence Group", "include_affiliates": true, "reason": "Existing Kestrel customer"}, {"company": "Hollis + Reed Architects", "include_affiliates": false, "reason": "Asked not to be contacted"}, {"company": "Stonecut Studio", "include_affiliates": false, "reason": "Asked not to be contacted"}], "sign_off": "Best,\nThe Kestrel Rooms team", "sign_off_confirmed": false, "engine": "offline"};

    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank">$2</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  let out=[], para=[], list=[], quote=[];
  const flush=()=>{ if(para.length){out.push("<p>"+para.map(inl).join("<br>")+"</p>");para=[]}
    if(list.length){out.push("<ul>"+list.map(i=>"<li>"+inl(i)+"</li>").join("")+"</ul>");list=[]}
    if(quote.length){out.push('<div class="quote">'+quote.map(inl).join("<br>")+"</div>");quote=[]} };
  for(const line of String(t||"").split("\n")){
    if(/^#{1,4}\s/.test(line)){flush();const l=line.match(/^#+/)[0].length;out.push(`<h${l+1}>${inl(line.replace(/^#+\s*/,""))}</h${l+1}>`);continue}
    if(/^\s*[*-]\s+/.test(line)){ if(para.length||quote.length){const l=list;list=[];flush();list=l} list.push(line.replace(/^\s*[*-]\s+/,""));continue}
    if(/^>/.test(line)){ if(para.length||list.length){flush()} quote.push(line.replace(/^>\s?/,""));continue}
    if(!line.trim()){flush();continue}
    if(list.length||quote.length) flush();
    para.push(line);
  }
  flush(); return '<div class="md">'+out.join("")+"</div>";
}

// ---------------------------------------------------------------- issue drawer
function emailHTML(p){
  if(!p.draft) return `<p class="muted">No draft: ${esc(p.status_note)}</p>`;
  const parts=p.draft.body.split("\n\n");
  return `<div class="mail"><div class="mailh"><b>To:</b> ${esc(p.firm)} · <b>Subject:</b> ${esc(p.draft.subject)}
   <span style="float:right" class="pill ok">${p.draft.words} words · guardrails pass</span></div>
   <div class="mailb"><span class="hl-fact" title="Written by the agent, grounded in the sourced fact">${esc(parts[0])}</span>\n\n<span class="hl-fixed" title="Inserted verbatim from the approved claims">${esc(parts.slice(1).join("\n\n"))}</span></div></div>
   <p class="small muted">Highlighted: written by the agent from the sourced fact. Grey: approved claims, call to action and sign-off, inserted by code word for word.</p>`;
}
function researchHTML(p){
  const pr=p.profile; let h="";
  if(pr) h+=`<h3>Segment: ${esc(pr.segment)}</h3><div class="small muted">${esc(pr.segment_reason)}</div><div class="quote">“${esc(pr.segment_quote)}”<br><a href="${esc(pr.segment_url)}" target="_blank">${esc(pr.segment_url)}</a></div>`;
  if(p.site_error) h+=`<h3>Website</h3><p class="bad">${esc(p.site_error)}</p>`;
  if(p.dnc) h+=`<h3>Do-not-contact check: <span class="${p.dnc.result==="Match"?"bad":"ok"}">${esc(p.dnc.result)}</span></h3><p class="small">${esc(p.dnc.detail)}</p>`;
  if(pr&&pr.affiliates&&pr.affiliates.length) h+=pr.affiliates.map(a=>`<div class="quote"><b>${esc(a.name)}</b> (${esc(a.relationship)}): “${esc(a.quote)}”<br><a href="${esc(a.url)}" target="_blank">${esc(a.url)}</a></div>`).join("");
  const ft=(p.fact_trail||[]).filter(t=>"fact" in t);
  if(ft.length) h+=`<h3>Fact candidates (${ft.length})</h3><table><tbody>${ft.map(t=>`<tr style="cursor:default"><td><span class="pill ${t.verified?'ok':'bad'}">${t.verified?'verified':'discarded'}</span></td>
    <td class="small"><span class="muted">${esc(t.kind||"")}</span> ${esc(t.fact)}</td></tr>`).join("")}</tbody></table>`;
  if(p.fact) h+=`<h3>Chosen fact</h3><p>${esc(p.fact.fact)}</p><div class="quote">“${esc(p.fact.quote)}”<br><a href="${esc(p.fact.url)}" target="_blank">${esc(p.fact.url)}</a></div>`;
  const dt=p.draft_trail||[];
  if(dt.length) h+=`<h3>Draft attempts (${dt.length})</h3>${dt.map(t=>{const errs=[...(t.violations||[]),...(t.style||[])];
    return `<div class="card pad" style="margin:8px 0"><div class="small"><span class="pill ${errs.length?'bad':'ok'}">attempt ${t.attempt}: ${errs.length?'rejected':'accepted'}</span></div>
    <div class="small" style="margin-top:6px">${esc(t.opener)}</div>${errs.length?`<ul class="small bad">${errs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}</div>`}).join("")}`;
  (p.overrides||[]).forEach(o=>{h+=`<h3>Human override</h3><p class="small">${esc(o.reason)}</p><div class="diff"><div class="before"><b class="small">Before (AI)</b><br>${esc(o.before.opener)}</div><div class="after"><b class="small">After (human)</b><br>${esc(o.after.opener)}</div></div>`});
  return h||'<p class="muted">No research: dropped before Step 4.</p>';
}

const EVENTS=[{seq:0,id:null,action:"Step 1: workspace set up",comment:`Project **${D.workspace.project}** created with labels ${D.workspace.labels.join(", ")} and statuses ${D.workspace.statuses.join(", ")}. Invited ${D.workspace.invites.join(", ")}.`}]
  .concat(P.flatMap(p=>(p.history||[]).map(h=>({...h,id:p.id})))).sort((a,b)=>a.seq-b.seq);

function renderReplay(){
  const e=EVENTS[ri], st=stateAt(ri), p=e.id?byId(e.id):null;
  $("#r-board").innerHTML=boardHTML(q=>st[q.id], true);
  if(e.id){const c=$("#card-"+e.id); if(c) c.classList.add("flash")}

   <h3 style="margin:6px 0">${esc(e.action.replace(/\*\*/g,""))}</h3>${e.status?`<div>${sChip(e.status)}${labels(e.labels)}</div>`:""}${md(e.comment)}`;

  if(ri===EVENTS.length-1) ri=0; $("#r-play").textContent="❚❚ Pause";
  timer=setInterval(()=>{ if(ri>=EVENTS.length-1){play();return} ri++; renderReplay() }, +$("#r-speed").value) }

   <button class="btn primary" id="r-play" onclick="play()">▶ Play</button><button class="btn" id="r-next" onclick="ri++;renderReplay()">Step ▶</button>
   <button class="btn" onclick="ri=EVENTS.length-1;renderReplay()">⏭</button>
   <label class="small muted">Speed <select id="r-speed" class="btn" style="padding:4px 8px"><option value="1400">Slow</option><option value="700" selected>Normal</option><option value="250">Fast</option></select></label>

// ---------------------------------------------------------------- agent & guardrails
function agent(){
  const rules=[["Never claim anything about Kestrel beyond the four approved claims","The model or rules write only the subject and opener. Product sentence, call to action and sign-off are inserted from config, word for word. Product, comparison and pricing words in the written parts are rejected."],
   ["Never state a prospect fact without a word-for-word source","Every quote must appear on the page it cites. Every number and proper noun in the opener must come from the source. The first sentence must carry the fact."],
   ["Never name another company","Blocklist of Kestrel customers, do-not-contact firms, other prospects and competitors, plus a check that rejects company-style names (Construction, LLC, Group…) other than the prospect's own."]];
  const pass=D.tests.filter(t=>t[0]==="PASS").length;
  $("#t-agent").innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${rules.map(([t,d],i)=>`<div class="card pad rule"><div class="small muted">Guardrail ${i+1}</div><b>${t}</b><p class="small muted">${d}</p></div>`).join("")}</div>
  <h2>How the agent works</h2>
  <div class="card pad small"><ol style="margin:0;padding-left:18px">
   <li><b>Read the site:</b> homepage plus up to 7 internal pages, with About, Projects and Awards first. If a site blocks requests, a reader service is tried; if both fail, the firm is dropped.</li>
   <li><b>Segment and affiliates</b> (Step 2/3 inputs), each backed by a quote from the site.</li>
   <li><b>Do-not-contact:</b> exact name matching for the firm and every named affiliate, not fuzzy matching.</li>
   <li><b>Fact:</b> candidates are verified against their page. The best kind wins: named award, then named project, then founding year.</li>
   <li><b>Draft:</b> the written opener plus the fixed approved blocks. Guardrails and style checks run on every attempt; a rejected draft is regenerated, and after repeated failures there's no email.</li></ol>
   <p class="muted">Engine: <b>${esc(engineLabel)}</b>. With an OpenRouter key the same steps can use an LLM, and if the model is unavailable it falls back to the offline rules. The guardrails are identical either way.</p></div>
  <h2>Guardrail tests <span class="pill ok">${pass}/${D.tests.length} pass</span></h2>
  <div class="card tablewrap"><table><tbody>${D.tests.map(([r,n])=>`<tr style="cursor:default"><td style="width:70px"><span class="pill ${r==="PASS"?"ok":"bad"}">${r}</span></td><td class="small">${esc(n.replace(/^test_/,"").replace(/_/g," "))}</td></tr>`).join("")}</tbody></table></div>
  <h2>Drafts blocked during this run (${rejections.length} guardrail · ${styleRej.length} style)</h2>
  ${rejections.concat(styleRej).length?`<div class="card tablewrap"><table><thead><tr><th>Issue</th><th>Rejected opener</th><th>Why</th></tr></thead><tbody>${rejections.concat(styleRej).map(({p,t})=>`<tr onclick="openIssue('${p.id}','research')"><td class="muted">${p.id}</td><td class="small">${esc(t.opener)}</td><td class="small bad">${[...(t.violations||[]),...(t.style||[])].map(esc).join("<br>")}</td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">No drafts were rejected in this run.</p>'}
  <h2>Human overrides (${overrides.length})</h2>
  ${overrides.map(({p,o})=>`<div class="card pad" style="margin-bottom:10px"><b>${p.id} · ${esc(p.firm)}</b><p class="small">${esc(o.reason)}</p>
   <div class="diff"><div class="before"><b class="small">Before (AI)</b><br>${esc(o.before.opener)}<div class="small muted">Subject: ${esc(o.before.subject)}</div></div>
   <div class="after"><b class="small">After (human, re-checked by the guardrails)</b><br>${esc(o.after.opener)}<div class="small muted">Subject: ${esc(o.after.subject)}</div></div></div></div>`).join("")||'<p class="muted">None.</p>'}
  <h2>Approved claims and do-not-contact list</h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card pad small"><b>Approved claims</b><ul>${D.claims.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
   <b>Sign-off</b> ${D.sign_off_confirmed?"":'<span class="pill warn">placeholder, asked Nirbhay</span>'}<div class="quote">${esc(D.sign_off).replace("\n","<br>")}</div></div>
   <div class="card pad small"><b>Do-not-contact</b><ul>${D.dnc_list.map(d=>`<li><b>${esc(d.company)}</b>${d.include_affiliates?" and affiliates":""}: ${esc(d.reason)}</li>`).join("")}</ul></div></div>`;
}
